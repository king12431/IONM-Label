name: Build Executables

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install Linux GUI dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk libglib2.0-0 libsm6 libxrender1 libxext6
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller numpy matplotlib scipy
    
    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name=MEP_Annotator labeler.py
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MEP_Annotator-${{ matrix.os }}
        path: dist/*